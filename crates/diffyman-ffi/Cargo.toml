[package]
name = "diffyman-ffi"
description = "Stable C ABI for the diffyman diff engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Shipped as a shared or static library with include/diffyman.h, not as a
# Rust crate.
publish = false

[lib]
# libdiffyman_ffi.{so,dylib,a}, diffyman_ffi.{dll,lib} on Windows.
name = "diffyman_ffi"
crate-type = ["cdylib", "staticlib"]
doctest = false

[dependencies]
diffyman = { workspace = true, features = ["fs"] }

[dev-dependencies]
# Generates include/diffyman.h in a test (src/tests.rs, `header_is_current`);
# never part of the library.
cbindgen.workspace = true
serde_json.workspace = true

[lints]
workspace = true
