# cbindgen configuration for include/diffyman.h. The header is generated by
# the test `header_is_current` (src/tests.rs), which fails when the committed
# header is out of date. Regenerate it with:
#
#   DIFFYMAN_BLESS=1 cargo test -p diffyman-ffi header_is_current

language = "C"
header = "/* SPDX-License-Identifier: MIT OR Apache-2.0 */"
include_guard = "DIFFYMAN_H"
autogen_warning = """/*
 * diffyman: the stable C ABI of the diffyman diff engine.
 * https://github.com/reddy-sh/diffyman
 *
 * Generated by cbindgen from crates/diffyman-ffi/src/lib.rs; do not edit.
 * Ownership rules and examples: crates/diffyman-ffi/README.md.
 */"""
cpp_compat = true
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
documentation = true
documentation_style = "doxy"
line_length = 100
tab_width = 4

[fn]
args = "Vertical"
