[package]
name = "diffyman"
description = "Headless diff engine: compare two inputs and get one canonical JSON Diff Document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["diff", "text", "json", "compare"]
categories = ["text-processing", "algorithms"]

[lib]
name = "diffyman"

[features]
default = ["fs"]
# Archives (zip, tar, tar.gz, tar.zst) compared as trees (spec §19). Without
# it, the pairs that need it are `Error::Unsupported` (spec §19.7).
archives = ["dep:diffyman-adapter-tree"]
# Folders on disk (`diff_paths`); implies `archives`. Off for
# wasm32-unknown-unknown builds, which compare archives from bytes only.
fs = ["archives", "diffyman-adapter-tree/fs"]

[dependencies]
diffyman-model.workspace = true
diffyman-algo.workspace = true
diffyman-detect.workspace = true
diffyman-adapter-binary.workspace = true
diffyman-adapter-tree = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true

# Criterion benchmarks on generated inputs: `cargo bench -p diffyman`.
[[bench]]
name = "engine"
harness = false

[lints]
workspace = true
