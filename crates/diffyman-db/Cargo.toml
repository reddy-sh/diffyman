[package]
name = "diffyman-db"
description = "PostgreSQL schema, migrations and queries for the diffyman server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Part of diffyman-server, which is not on crates.io at 0.1.0.
publish = false

[dependencies]
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
serde_json.workspace = true
