# cargo-deny configuration (checked with cargo-deny 0.20.2).
# Run: cargo deny check

[graph]
all-features = true

[advisories]
# RustSec advisory database.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# The single dependency allowlist. Copyleft licenses (GPL, AGPL, LGPL) and
# source-available licenses (SSPL, BUSL) are not listed, so they are denied.
# MPL-2.0 is file-level copyleft: allowed, but ship its notices.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates with `publish = false` (such as the conformance runner).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
