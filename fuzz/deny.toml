# cargo-deny configuration of the fuzz workspace: the root policy (deny.toml at
# the repository root) plus NCSA, the license of the libFuzzer sources that
# libfuzzer-sys bundles. Nothing here is linked into a shipped crate.
# Path dependencies on the workspace crates carry no version, so wildcard
# paths are allowed here.
# Run: cargo deny --manifest-path fuzz/Cargo.toml check

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
  "NCSA",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
