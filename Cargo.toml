[workspace]
resolver = "3"
members = ["crates/*", "bindings/python", "bindings/wasm"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reddy-sh/diffyman"
homepage = "https://reddy.sh"
authors = ["Sankara Reddy Telukutla <sankara@reddy.sh>"]

# Every external dependency is pinned to an exact version. A version bump that
# changes diff output also bumps the matching algorithm ID (docs/spec).
[workspace.dependencies]
# Workspace crates
diffyman-model = { path = "crates/diffyman-model", version = "=0.0.1" }
diffyman-algo = { path = "crates/diffyman-algo", version = "=0.0.1" }
diffyman = { path = "crates/diffyman-engine", version = "=0.0.1" }

# Serialization and hashing
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
schemars = "=1.2.3"
ryu-js = "=1.0.3"
sha2 = "=0.11.1"
thiserror = "=2.0.21"

# Diff algorithms and text handling
imara-diff = { version = "=0.2.0", default-features = false }
similar = { version = "=3.2.1", default-features = false, features = ["std"] }
unicode-segmentation = "=1.13.3"
icu_casemap = "=2.4.0"
icu_properties = "=2.4.0"
regex = "=1.13.1"

# Command line
clap = { version = "=4.6.7", features = ["derive"] }

# Bindings (thin JSON-in/JSON-out wrappers, docs/adr/0007-binding-strategy.md)
pyo3 = { version = "=0.30.1", features = ["abi3-py311"] }
wasm-bindgen = "=0.2.130"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that add noise without catching bugs in this code base.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
assert_is_empty = "allow"
# Selected restriction lints.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
