name: Nightly

# Slow checks that stay out of pull request CI: every fuzz target for a few
# minutes, and the benchmarks. Runs every night and on demand.
#
# Hygiene: no pull_request_target, no secrets, read-only token, checkout
# without stored credentials, and no `${{ }}` expressions inside `run:`
# scripts (values reach the shell through `env:` and are quoted there).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds to run each fuzz target
        required: false
        default: "300"
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    # bash -eo pipefail on every runner.
    shell: bash

jobs:
  fuzz:
    # fuzz/README.md: one Cargo workspace of its own, built with a nightly
    # toolchain, AddressSanitizer and debug assertions.
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: diff
          - target: options
            dict: fuzz/options.dict
          - target: jcs_roundtrip
          - target: refine
          - target: moves
    env:
      # Overrides rust-toolchain.toml for every cargo call in this job,
      # including the cache action's.
      RUSTUP_TOOLCHAIN: nightly
      TARGET: ${{ matrix.target }}
      DICT: ${{ matrix.dict }}
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '300' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Show toolchain
        run: cargo +nightly --version

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz -> target
          key: fuzz-${{ matrix.target }}

      - name: Install cargo-fuzz
        run: cargo +nightly install --locked cargo-fuzz --version 0.13.2

      - name: Fetch the locked fuzz dependencies
        run: cargo +nightly fetch --locked --manifest-path fuzz/Cargo.toml

      - name: Fuzz
        run: |
          case $FUZZ_SECONDS in
            ''|*[!0-9]*) echo "fuzz_seconds must be a whole number of seconds" >&2; exit 2 ;;
          esac
          # A single input that runs over 60 s counts as a hang (a failure).
          set -- -max_total_time="$FUZZ_SECONDS" -timeout=60
          if [ -n "$DICT" ]; then
            set -- "$@" -dict="$DICT"
          fi
          cargo +nightly fuzz run "$TARGET" --fuzz-dir fuzz -- "$@"

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Criterion benchmarks (quick mode)
        # Shared runners are noisy: these numbers show trends, not small
        # regressions.
        run: cargo bench --locked -p diffyman --bench engine -- --quick 2>&1 | tee criterion.txt

      - name: Build the CLI
        run: cargo build --locked --release -p diffyman-cli

      - name: End-to-end comparison (diffyman, git diff --no-index, diff)
        run: |
          scripts/bench.sh --bin target/release/diffyman --data "$RUNNER_TEMP/bench" > bench.md
          cat bench.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: |
            criterion.txt
            bench.md
            target/criterion/
          if-no-files-found: warn
          retention-days: 90
