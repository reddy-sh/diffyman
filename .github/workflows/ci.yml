name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The server crates compile from the offline query data in .sqlx/. No
      # database runs here, so their database tests skip with a note; the
      # database job runs them, and the server end to end, on Linux.
      SQLX_OFFLINE: "true"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Show toolchain
        run: rustup show

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Fetch dependencies
        # The only step of this job that may use the network for Cargo.
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        # --all-targets also checks the benchmarks, which run nightly
        # (nightly.yml).
        run: cargo clippy --locked --offline --workspace --all-targets -- -D warnings

      # Tests and the conformance corpus run offline: Cargo may not touch the
      # network, and HTTP clients that honor the proxy variables get a port
      # nothing listens on. No test needs the network (the git tests use local
      # repositories and a temporary configuration only), so a test that starts
      # to need it fails here instead of passing by luck.
      - name: Test (offline)
        env:
          CARGO_NET_OFFLINE: "true"
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: cargo test --locked --offline --workspace

      - name: Conformance corpus (offline)
        env:
          CARGO_NET_OFFLINE: "true"
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: cargo run --locked --offline -p diffyman-conformance -- --strict

      - name: Build the engine for wasm32
        if: runner.os == 'Linux'
        # As the WASM binding uses it: without `fs` (no folder walking), with
        # and without archive support.
        run: |
          cargo build --locked -p diffyman --no-default-features --target wasm32-unknown-unknown
          cargo build --locked -p diffyman --no-default-features --features archives --target wasm32-unknown-unknown

  bindings:
    # Every binding, its own tests, then tests/conformance/run_bindings.py:
    # the CLI, Python, WASM (with and without archives), Node.js, Java and the
    # C ABI return byte-identical Diff Documents for every corpus case
    # (docs/adr/0007-binding-strategy.md). Each runner uploads the SHA-256 of
    # every document; `bindings-same-everywhere` compares them across the
    # three operating systems.
    name: bindings (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/bindings/python/.venv
      # Absolute, because npm runs package scripts in the package folder.
      DIFFYMAN_CLI: ${{ github.workspace }}/target/release/diffyman
      # This job checks behaviour, not the shipped binaries: optimized code
      # without LTO and with parallel codegen builds the six native libraries
      # and three WASM packages several times faster. The python-wheels and
      # node-prebuilds jobs build with the real release profile.
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install wasm-pack
        run: cargo install --locked wasm-pack --version 0.15.1

      - name: Build the CLI, the C ABI and the JNI library
        run: cargo build --locked --release -p diffyman-cli -p diffyman-ffi -p diffyman-java

      - name: Build the Python binding (maturin develop)
        run: |
          case "$RUNNER_OS" in
            Windows) bin="$VIRTUAL_ENV/Scripts" ;;
            *) bin="$VIRTUAL_ENV/bin" ;;
          esac
          echo "VENV_BIN=$bin" >> "$GITHUB_ENV"
          uv venv --python 3.12 "$VIRTUAL_ENV"
          uv pip install maturin==1.16.0 pytest==9.2.0 mypy==2.4.0
          "$bin/maturin" develop --uv --release --locked -m bindings/python/Cargo.toml

      - name: Python binding tests
        run: '"$VENV_BIN/python" -m pytest -q bindings/python/tests'

      - name: Python binding types (mypy --strict)
        if: runner.os == 'Linux'
        run: '"$VENV_BIN/mypy" --config-file bindings/python/pyproject.toml'

      - name: Build the WASM packages (Node.js; Node.js without archives)
        run: |
          wasm-pack build bindings/wasm --release --target nodejs --out-dir pkg-node -- --locked
          wasm-pack build bindings/wasm --release --target nodejs --out-dir pkg-node-slim -- --locked --no-default-features

      - name: React hook and example app (web WASM package)
        # Plain TypeScript over the same WASM module: one platform is enough.
        if: runner.os == 'Linux'
        run: |
          wasm-pack build bindings/wasm --release --target web --out-dir pkg-web -- --locked
          npm --prefix bindings/wasm/react ci
          npm --prefix bindings/wasm/react run build
          npm --prefix bindings/wasm/react run typecheck
          npm --prefix bindings/wasm/react test
          npm --prefix bindings/wasm/react run check:types
          npm --prefix examples/amplify-react ci
          npm --prefix examples/amplify-react test

      - name: Node.js binding (napi build and tests)
        run: |
          npm --prefix bindings/node ci
          npm --prefix bindings/node run build
          npm --prefix bindings/node test

      - name: Node.js binding types
        if: runner.os == 'Linux'
        run: npm --prefix bindings/node run types:check

      - name: Java binding (mvn verify)
        run: mvn -B -ntp -f bindings/java/pom.xml verify

      - name: C ABI (C test program with sanitizers)
        # tests/ffi/run.sh is a POSIX shell script around the platform's `cc`.
        # On Windows the conformance run below reaches the same exported
        # functions of diffyman_ffi.dll through ctypes instead.
        if: runner.os != 'Windows'
        env:
          PROFILE: release
        run: PYTHON="$VENV_BIN/python" bash tests/ffi/run.sh

      - name: Cross-binding conformance (CLI, Python, WASM, WASM without archives, Node.js, Java, C)
        env:
          C_DRIVER: ${{ runner.os == 'Windows' && 'ctypes' || 'program' }}
        run: >-
          uv run --no-project --python 3.12 python tests/conformance/run_bindings.py
          --cli target/release/diffyman --c-driver "$C_DRIVER"
          --hashes "conformance-hashes/$RUNNER_OS.tsv"

      - name: Upload the document hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-hashes-${{ runner.os }}
          path: conformance-hashes/
          if-no-files-found: warn
          retention-days: 30

  bindings-same-everywhere:
    # The documents of every surface on Linux, macOS and Windows have the
    # same SHA-256 (provenance removed), equal to expected.json.
    name: bindings byte-identical across operating systems
    needs: bindings
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the hash tables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conformance-hashes-*
          path: conformance-hashes
          merge-multiple: true

      - name: Compare
        run: python3 tests/conformance/compare_hashes.py conformance-hashes

  database:
    # diffyman-db and diffyman-server against a real PostgreSQL 18
    # (docs/adr/0012-local-service-architecture.md): the offline query data in
    # .sqlx/ must match the queries and migrations, the integration tests must
    # run (DIFFYMAN_TEST_DB_REQUIRED turns their skip into a failure), and a
    # real diffyman-server process must pass tests/server/run_e2e.py and the
    # server surface of the conformance runner. The service is a throwaway
    # container on 127.0.0.1; its bootstrap password is replaced by a random
    # one before anything else connects, so no secret is needed.
    name: database and server (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: diffyman
          POSTGRES_DB: diffyman
          POSTGRES_PASSWORD: bootstrap-only
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U diffyman -d diffyman"
          --health-interval 5s --health-retries 20
    env:
      DIFFYMAN_TEST_DB_REQUIRED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Random database password
        # Masked in the log; the SQL goes to psql on standard input, never on
        # a command line.
        run: |
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq postgresql-client; }
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf "ALTER ROLE diffyman PASSWORD '%s';\n" "$password" \
            | PGPASSWORD=bootstrap-only psql -h 127.0.0.1 -U diffyman -d postgres -X -q -v ON_ERROR_STOP=1
          {
            echo "DIFFYMAN_TEST_DB_URL=postgres://diffyman:$password@127.0.0.1:5432/postgres"
            echo "DIFFYMAN_CI_DB_URL=postgres://diffyman:$password@127.0.0.1:5432/diffyman"
          } >> "$GITHUB_ENV"

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install sqlx-cli
        run: cargo install --locked sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls,sqlx-toml

      - name: Offline query data is current
        # The macros and `migrate` read DIFFYMAN_DB_URL (crates/diffyman-db/
        # sqlx.toml); `prepare` runs at the workspace root, where sqlx-cli
        # reads only DATABASE_URL.
        env:
          DIFFYMAN_DB_URL: ${{ env.DIFFYMAN_CI_DB_URL }}
          DATABASE_URL: ${{ env.DIFFYMAN_CI_DB_URL }}
        run: |
          (cd crates/diffyman-db && cargo sqlx migrate run)
          cargo sqlx prepare --workspace --check -- --all-targets

      - name: Integration tests
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --locked -p diffyman-db -p diffyman-storage -p diffyman-server

      - name: Build the server and the CLI
        env:
          SQLX_OFFLINE: "true"
          # Behaviour, not the shipped binary: optimized without LTO.
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --locked --release -p diffyman-server -p diffyman-cli

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Server end to end (a real diffyman-server process)
        # Its own database (diffyman_e2e) and blob folder, a random port on
        # 127.0.0.1: every file case of the corpus, 30 jobs, saved diffs and
        # deletion, keys, Host, Origin and limits, a 200 MB pair, throughput.
        run: >-
          uv run --no-project --python 3.12 python tests/server/run_e2e.py
          --server target/release/diffyman-server --cli target/release/diffyman
          --workdir-root "$RUNNER_TEMP" --min-free-gb 3 --report "$RUNNER_TEMP/server-e2e.json"

      - name: Server request validation (a real diffyman-server process)
        # Its own database (diffyman_e2e_validation): keys and scopes, other
        # keys' IDs, Host and Origin, malformed IDs, hostile names, options
        # and query parameters, and no secret in errors, OpenAPI or the log.
        run: >-
          uv run --no-project --python 3.12 python tests/server/test_validation.py
          --server target/release/diffyman-server --workdir-root "$RUNNER_TEMP"

      - name: Server limits (a real diffyman-server process)
        # Its own database (diffyman_limits) and a server per group: bodies
        # over their limits (declared, chunked, understated), multipart bodies
        # with thousands of parts, slow bodies and headers, 40 parallel
        # synchronous diffs within the memory budget, archive bombs and deep
        # nesting run as jobs, cancelling a running job. Smaller inputs here.
        run: >-
          uv run --no-project --python 3.12 python tests/server/test_limits.py
          --server target/release/diffyman-server --scale ci
          --workdir-root "$RUNNER_TEMP" --min-free-gb 3 --report "$RUNNER_TEMP/server-limits.json"

      - name: Conformance, server surface (POST /v1/diff and the CLI)
        run: >-
          uv run --no-project --python 3.12 python tests/server/harness.py
          --server target/release/diffyman-server --workdir-root "$RUNNER_TEMP" --
          python tests/conformance/run_bindings.py --surfaces cli,server
          --cli target/release/diffyman --quiet

      - name: API reference and REST quickstart examples (curl against a real server)
        run: >-
          uv run --no-project --python 3.12 python docs/api/check_examples.py
          --workdir-root "$RUNNER_TEMP"

      - name: Upload the server measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-e2e
          path: |
            ${{ runner.temp }}/server-e2e.json
            ${{ runner.temp }}/server-limits.json
          if-no-files-found: warn
          retention-days: 30

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: Licenses, advisories, bans and sources
        run: cargo deny check

  python-wheels:
    # abi3 wheels (one per platform covers CPython 3.11+). Uploaded as
    # artifacts only; nothing is published from CI.
    name: python wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            smoke: true
          - os: macos-latest
            target: x86_64-apple-darwin
            smoke: false
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
            smoke: true
          - os: ubuntu-latest
            target: aarch64
            manylinux: "2_28"
            smoke: false
          - os: windows-latest
            target: x64
            smoke: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist -m bindings/python/Cargo.toml

      - name: Set up uv
        if: matrix.smoke
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Smoke test (CPython 3.11 and 3.14)
        # Cross-compiled wheels (x86_64 macOS on an arm64 runner, aarch64
        # Linux on x86_64) are built and uploaded but not run here.
        if: matrix.smoke
        run: |
          wheels=(dist/*.whl)
          for python in 3.11 3.14; do
            uv run --no-project --python "$python" --with "${wheels[0]}" --with pytest==9.2.0 \
              python -m pytest -q bindings/python/tests
          done

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  python-sdist:
    name: python sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          command: sdist
          args: --out dist -m bindings/python/Cargo.toml

      - name: Upload the sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  node-prebuilds:
    # The napi targets of bindings/node/package.json, uploaded as artifacts
    # only; nothing is published from CI.
    name: node addon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            smoke: true
          - os: macos-latest
            target: x86_64-apple-darwin
            smoke: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            smoke: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            smoke: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            smoke: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml) and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: node-${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the build tools
        run: npm --prefix bindings/node ci

      - name: Build the addon
        working-directory: bindings/node
        run: npx napi build --platform --release --no-js --no-dts-header --dts native.d.ts --target "$TARGET" -- --locked

      - name: Smoke test (node --test)
        if: matrix.smoke
        run: npm --prefix bindings/node test

      - name: Upload the addon
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-addon-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error
          retention-days: 14
