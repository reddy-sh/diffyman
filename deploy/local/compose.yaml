# Local stack for diffyman-server. The engine, CLI and bindings never need it.
# Every port is bound to 127.0.0.1 only. Ports are project conventions:
#   5433 Postgres · 9000/9001 RustFS · 4317/4318 OTLP · 3001 Grafana · 6380 Valkey · 8080 API
#   8081 API in a container (profile server)
# Start with: scripts/local-up.sh (operations: docs/operations.md)
name: diffyman

services:
  postgres:
    image: postgres:18.6-trixie
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_USER: diffyman
      POSTGRES_DB: diffyman
      POSTGRES_PASSWORD: ${DIFFYMAN_PG_PASSWORD:?set in .env.local}
    volumes: ["pgdata:/var/lib/postgresql"] # PG18 image: mount the parent dir, not .../data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffyman -d diffyman"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  rustfs: # S3-compatible server for integration tests only
    profiles: ["s3"]
    image: rustfs/rustfs:1.0.4
    command: /data
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    environment:
      RUSTFS_ACCESS_KEY: ${DIFFYMAN_S3_TEST_KEY:?set in .env.local}
      RUSTFS_SECRET_KEY: ${DIFFYMAN_S3_TEST_SECRET:?set in .env.local}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes: ["rustfsdata:/data"]

  lgtm: # traces, logs and metrics UI for local development only
    profiles: ["obs"]
    image: grafana/otel-lgtm:0.40.0
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318", "127.0.0.1:3001:3000"]

  # The container server has its own database and blob volume: sharing the
  # native server's database with a different blob store would leave rows
  # pointing at objects the other server cannot see.
  parity-db: # creates the database diffyman_parity once, then exits
    profiles: ["server"]
    image: postgres:18.6-trixie
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: diffyman
      PGPASSWORD: ${DIFFYMAN_PG_PASSWORD:?set in .env.local}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'diffyman_parity'" | grep -q 1
        || createdb diffyman_parity
    restart: "no"

  diffyman-server: # the container image, to check parity with the native server on 8080
    profiles: ["server"]
    image: diffyman-server:local # scripts/build-server-image.sh, or built here when missing
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      parity-db: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8081:8080"]
    environment:
      DIFFYMAN_DB_URL: postgres://diffyman:${DIFFYMAN_PG_PASSWORD:?set in .env.local}@postgres:5432/diffyman_parity
      DIFFYMAN_ALLOWED_HOSTS: 127.0.0.1:8081,localhost:8081
    volumes: ["serverdata:/data"] # blobs, temporary files and the admin token
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: on-failure:3

volumes:
  pgdata: {}
  rustfsdata: {}
  serverdata: {}
