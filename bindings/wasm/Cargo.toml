[package]
name = "diffyman-wasm"
description = "WebAssembly binding for the diffyman diff engine (wasm-bindgen)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
diffyman.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# wasm-opt is downloaded on demand; keep the build reproducible and offline-able.
wasm-opt = false
