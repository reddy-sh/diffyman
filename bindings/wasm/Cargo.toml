[package]
name = "diffyman-wasm"
description = "WebAssembly binding for the diffyman diff engine (wasm-bindgen)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["archives"]
# Zip, tar, tar.gz and tar.zst compared as trees (spec §19). Without it the
# module is smaller and two archives are a typed `unsupported` error
# (spec §19.7); see docs/adr/0008-wasm-target.md for the sizes.
archives = ["diffyman/archives"]

[dependencies]
diffyman.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
# wasm-opt is downloaded on demand; keep the build reproducible and offline-able.
wasm-opt = false
